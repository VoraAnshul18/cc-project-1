services:
  - type: web
    name: student-information-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_NAME
        value: studentDB
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        value: "*"
